<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <meta name="description" content="DeepSeek Harness 手机端：查看全部 DSH 会话并继续对话。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DSH">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-180.png" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <title>DSH 手机端</title>
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="44" height="44"><path d="M10 30c0-11 9-19 22-19 12 0 20 7 22 17l4 8-7-2c-2 8-10 14-20 14-11 0-19-6-21-15l-5-2 5-1z" fill="currentColor" opacity=".92"/><circle cx="24" cy="28" r="2.6" fill="#0b0f14"/><circle cx="38" cy="28" r="2.6" fill="#0b0f14"/><path d="M27 36c3 2 7 2 10 0" stroke="#0b0f14" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div class="boot-text">正在连接 DSH…</div>
  </div>

  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="52" height="52"><path d="M10 30c0-11 9-19 22-19 12 0 20 7 22 17l4 8-7-2c-2 8-10 14-20 14-11 0-19-6-21-15l-5-2 5-1z" fill="currentColor" opacity=".92"/><circle cx="24" cy="28" r="2.6" fill="#0b0f14"/><circle cx="38" cy="28" r="2.6" fill="#0b0f14"/><path d="M27 36c3 2 7 2 10 0" stroke="#0b0f14" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      </div>
      <h1>DSH 手机端</h1>
      <p class="login-sub">查看全部会话，实时跟进并继续对话。</p>
      <form id="login-form" autocomplete="off">
        <label class="field">
          <span>访问码</span>
          <input id="token-input" type="password" inputmode="text" autocomplete="current-password" spellcheck="false" placeholder="粘贴桌面端显示的访问码">
        </label>
        <button id="login-button" class="primary" type="submit">进入</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
      <p class="login-foot">访问码在桌面端左下角 📱 面板里，也可以直接扫描二维码。</p>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <button id="back-button" class="icon-button" type="button" aria-label="返回会话列表" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="title-wrap">
          <div id="topbar-title" class="topbar-title">会话</div>
          <div id="topbar-sub" class="topbar-sub"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="cancel-button" class="icon-button danger" type="button" aria-label="停止当前回复" title="停止当前回复" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
        <button id="menu-button" class="icon-button" type="button" aria-label="更多操作">
          <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div id="menu" class="menu" hidden>
      <button id="menu-refresh" type="button">刷新</button>
      <button id="menu-new" type="button">新建会话</button>
      <button id="menu-blank" type="button">空白会话</button>
      <button id="menu-reasoning" type="button">思考过程</button>
      <button id="menu-tools" type="button">工具调用</button>
      <button id="menu-logout" type="button" class="danger-text">退出登录</button>
    </div>

    <div id="conn-banner" class="conn-banner" hidden></div>

    <main id="main" class="main">
      <section id="list-view" class="list-view">
        <div class="list-head">
          <div class="list-title-row">
            <h1>全部会话 <span id="session-count" class="count"></span></h1>
            <button id="refresh-button" class="icon-button" type="button" aria-label="刷新会话列表">
              <svg viewBox="0 0 24 24" width="21" height="21"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search-input" type="search" placeholder="搜索标题、目录或 ID" autocomplete="off" enterkeyhint="search">
          </div>
        </div>
        <div id="session-list" class="session-list" role="list"></div>
        <div id="list-empty" class="empty" hidden>
          <div class="empty-icon">🌊</div>
          <div class="empty-title">还没有会话</div>
          <div class="empty-sub">在桌面端开始一个对话，或点右上角 + 新建。</div>
        </div>
      </section>

      <section id="chat-view" class="chat-view" hidden>
        <button id="load-older" class="load-older" type="button" hidden>加载更早的消息</button>
        <div id="messages" class="messages" aria-live="polite"></div>
        <button id="scroll-bottom" class="scroll-bottom" type="button" aria-label="回到最新" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="typing" class="typing" hidden><i></i><i></i><i></i><span id="typing-text">正在思考…</span></div>
      </section>
    </main>

    <footer id="composer" class="composer" hidden>
      <div class="composer-inner">
        <textarea id="composer-input" rows="1" placeholder="继续对话…" enterkeyhint="send" autocomplete="off"></textarea>
        <button id="send-button" class="send-button" type="button" aria-label="发送消息">
          <svg viewBox="0 0 24 24" width="21" height="21"><path d="M4 12l15-7-6 15-2.5-6.5L4 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="composer-hint" class="composer-hint"></div>
    </footer>
  </div>

  <dialog id="new-dialog" class="dialog">
    <form id="new-form" method="dialog">
      <h2>新建会话</h2>
      <p class="dialog-sub">会话会在这个工作目录中启动。</p>
      <label class="field">
        <span>工作目录</span>
        <input id="new-cwd" type="text" spellcheck="false" placeholder="例如 D:\DSHProjects">
      </label>
      <div id="cwd-chips" class="cwd-chips"></div>
      <div class="dialog-actions">
        <button id="new-cancel" class="ghost" type="button">取消</button>
        <button id="new-create" class="primary" type="submit">创建</button>
      </div>
      <p id="new-error" class="form-error" role="alert"></p>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <noscript><p class="noscript">需要启用 JavaScript 才能使用 DSH 手机端。</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
